<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MindFlip</title>
<style>
:root{
  --bg:#eceaf6;--bg2:#d9d4f0;--ink:#1c1a33;--mute:#6a6688;--panel:rgba(255,255,255,.62);--line:rgba(60,50,120,.16);
  --back1:#5b4bd6;--back2:#2fb7c9;--face:#ffffff;--glow:rgba(91,75,214,.35);--accent:#5b4bd6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0e1f;--bg2:#1b1840;--ink:#efeefb;--mute:#9a96c2;--panel:rgba(255,255,255,.06);--line:rgba(190,180,255,.16);
    --back1:#7d6cff;--back2:#35d0c0;--face:#1d1b3a;--glow:rgba(125,108,255,.45);--accent:#9a8dff;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0e1f;--bg2:#1b1840;--ink:#efeefb;--mute:#9a96c2;--panel:rgba(255,255,255,.06);--line:rgba(190,180,255,.16);
  --back1:#7d6cff;--back2:#35d0c0;--face:#1d1b3a;--glow:rgba(125,108,255,.45);--accent:#9a8dff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background:radial-gradient(1100px 600px at 80% -10%,var(--bg2),transparent 60%),var(--bg);
  display:flex;justify-content:center;
}
main{width:100%;max-width:560px;padding:20px 16px 28px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:clamp(34px,9vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1}
h1 span{display:inline-block;transform-origin:50% 60%;animation:wob 1.6s .3s ease-in-out 1 both}
h1 span:nth-child(n+5){color:var(--accent)}
@keyframes wob{0%{transform:rotateX(0)}50%{transform:rotateX(180deg)}100%{transform:rotateX(360deg)}}
.tag{color:var(--mute);font-size:14px;margin:6px 0 0}
.stats{display:flex;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-width:68px;backdrop-filter:blur(8px)}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat small{color:var(--mute);font-size:12px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:16px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ghost{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:clamp(8px,2.4vw,12px);perspective:1000px}
.card{aspect-ratio:1/1.12;padding:0;border:0;background:none;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.b{background:linear-gradient(145deg,var(--back1),var(--back2));box-shadow:0 8px 20px -10px var(--glow)}
.b::before,.b::after{content:"";position:absolute;width:56%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.b::before{transform:translateX(-18%)}.b::after{transform:translateX(18%)}
.card:not(.up):not(.done):hover .b{filter:brightness(1.1)}
.f{transform:rotateY(180deg);background:var(--face);border:1px solid var(--line)}
.f svg{width:54%;height:54%;stroke:hsl(var(--h) 75% 55%);fill:hsl(var(--h) 80% 60%/.22);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card.done .f{border-color:hsl(var(--h) 75% 55%);box-shadow:0 0 0 2px hsl(var(--h) 75% 55%/.35),0 0 24px -4px hsl(var(--h) 80% 60%/.55);animation:pop .45s .35s both}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.08)}}
.card.bad .f{animation:shake .35s}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
#msg{color:var(--mute);text-align:center;font-size:14px;margin:16px 0 0;min-height:1.4em}
dialog{border:1px solid var(--line);border-radius:24px;background:var(--bg);color:var(--ink);padding:28px;max-width:340px;width:calc(100% - 32px);text-align:center;box-shadow:0 30px 80px -20px var(--glow)}
dialog::backdrop{background:rgba(10,8,30,.55);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}
dialog p{margin:6px 0;color:var(--mute);line-height:1.5}
dialog .go{margin-top:16px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:12px 24px;border-radius:999px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.in{transition:none}h1 span,.card.done .f,.card.bad .f{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 aria-label="MindFlip"><span>M</span><span>i</span><span>n</span><span>d</span><span>F</span><span>l</span><span>i</span><span>p</span></h1>
      <p class="tag">Flip two cards. Find every pair.</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="moves">0</b><small>Moves</small></div>
      <div class="stat"><b id="time">0:00</b><small>Time</small></div>
    </div>
  </header>
  <div class="bar">
    <div class="seg" id="seg" role="group" aria-label="Difficulty">
      <button data-d="6" aria-pressed="false">Easy</button>
      <button data-d="8" aria-pressed="true">Medium</button>
      <button data-d="12" aria-pressed="false">Hard</button>
    </div>
    <button class="ghost" id="restart">New game</button>
  </div>
  <div class="board" id="board" role="group" aria-label="Memory cards"></div>
  <p id="msg" aria-live="polite"></p>
</main>
<dialog id="win">
  <h2>You did it!</h2>
  <p id="wt"></p>
  <p id="wb"></p>
  <button class="go" id="again">Play again</button>
</dialog>
<script>
(function(){
  var P=[
    '<path d="M12 2l3 7 7 .5-5.500 4.500 2 7L12 17l-6.500 4 2-7L2 9.500 9 9z"/>',
    '<path d="M12 21s-8-5-8-11a4.500 4.500 0 0 1 8-2.500A4.500 4.500 0 0 1 20 10c0 6-8 11-8 11z"/>',
    '<path d="M20 14.500A8.500 8.500 0 1 1 9.500 4a7 7 0 0 0 10.500 10.500z"/>',
    '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
    '<path d="M12 3l10 18H2z"/>',
    '<path d="M12 2l9 10-9 10-9-10z"/>',
    '<circle cx="12" cy="12" r="8.500"/><circle cx="12" cy="12" r="3"/>',
    '<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15zM5 19l8-8"/>',
    '<path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18"/>',
    '<path d="M12 3s7 7 7 12a7 7 0 0 1-14 0c0-5 7-12 7-12z"/>',
    '<path d="M2 9c3-4 5 4 10 0s7 4 10 0M2 16c3-4 5 4 10 0s7 4 10 0"/>',
    '<path d="M12 2l8.500 5v10L12 22l-8.500-5V7z"/>'
  ];
  var NAMES=['star','heart','moon','bolt','triangle','diamond','ring','leaf','spark','drop','wave','hexagon'];
  var board=document.getElementById('board'),movesEl=document.getElementById('moves'),timeEl=document.getElementById('time'),
      msg=document.getElementById('msg'),win=document.getElementById('win'),pairs=8,moves=0,matched=0,first=null,lock=false,
      t0=0,timer=null;

  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function stop(){clearInterval(timer);timer=null}
  function elapsed(){return Math.round((Date.now()-t0)/1000)}

  function start(){
    stop();moves=0;matched=0;first=null;lock=false;t0=0;
    movesEl.textContent='0';timeEl.textContent='0:00';
    var best=store('mindflip-best-'+pairs);
    msg.textContent=best?'Best on this level: '+best.split('|')[0]+' moves, '+fmt(+best.split('|')[1])+'.':'Tap any card to begin.';
    board.style.setProperty('--cols',pairs===6?3:4);
    var deck=[];
    for(var i=0;i<pairs;i++){deck.push(i);deck.push(i)}
    shuffle(deck);
    board.innerHTML='';
    deck.forEach(function(id){
      var b=document.createElement('button');
      b.className='card';b.type='button';b.dataset.id=id;
      b.setAttribute('aria-label','Hidden card');
      b.style.setProperty('--h',Math.round(id*30+250)%360);
      b.innerHTML='<span class="in"><span class="b"></span><span class="f"><svg viewBox="0 0 24 24" aria-hidden="true">'+P[id]+'</svg></span></span>';
      b.addEventListener('click',function(){flip(b)});
      board.appendChild(b);
    });
  }

  function reveal(c,on){
    c.classList.toggle('up',on);
    c.setAttribute('aria-label',on?NAMES[c.dataset.id]+' card':'Hidden card');
  }

  function flip(c){
    if(lock||c===first||c.classList.contains('done'))return;
    if(!timer){t0=Date.now();timer=setInterval(function(){timeEl.textContent=fmt(elapsed())},500)}
    reveal(c,true);
    if(!first){first=c;return}
    moves++;movesEl.textContent=moves;
    var a=first,b=c;first=null;lock=true;
    if(a.dataset.id===b.dataset.id){
      setTimeout(function(){
        [a,b].forEach(function(x){x.classList.remove('up');x.classList.add('done')});
        matched++;lock=false;msg.textContent='Nice match.';
        if(matched===pairs)finish();
      },350);
    }else{
      setTimeout(function(){[a,b].forEach(function(x){x.classList.add('bad')})},450);
      setTimeout(function(){
        [a,b].forEach(function(x){x.classList.remove('bad');reveal(x,false)});
        lock=false;msg.textContent='Not a pair. Try again.';
      },950);
    }
  }

  function finish(){
    stop();
    var s=elapsed();timeEl.textContent=fmt(s);
    var key='mindflip-best-'+pairs,prev=store(key),pm=prev?+prev.split('|')[0]:Infinity,ps=prev?+prev.split('|')[1]:Infinity;
    var record=moves<pm||(moves===pm&&s<ps);
    if(record)store(key,moves+'|'+s);
    document.getElementById('wt').textContent='Solved in '+moves+' moves and '+fmt(s)+'.';
    document.getElementById('wb').textContent=record?'That’s a new best for this level.':'Best so far: '+pm+' moves, '+fmt(ps)+'.';
    setTimeout(function(){
      if(win.showModal)win.showModal();else win.setAttribute('open','');
    },700);
  }

  document.getElementById('seg').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    pairs=+b.dataset.d;
    [].forEach.call(this.children,function(x){x.setAttribute('aria-pressed',x===b)});
    start();
  });
  document.getElementById('restart').addEventListener('click',start);
  document.getElementById('again').addEventListener('click',function(){
    if(win.close)win.close();else win.removeAttribute('open');
    start();
  });
  start();
})();
</script>
</body>
</html>
